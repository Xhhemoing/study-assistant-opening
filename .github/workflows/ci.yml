name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/opening-release
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aistudy
          POSTGRES_PASSWORD: aistudy
          POSTGRES_DB: aistudy_opening_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistudy -d aistudy_opening_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-e2e:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aistudy
          POSTGRES_PASSWORD: aistudy
          POSTGRES_DB: aistudy_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aistudy -d aistudy_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # bitnami/minio starts an S3-compatible API without needing a custom command
      # (GitHub Actions service containers cannot set image CMD easily).
      # Bitnami moved pre-2025-08 images to bitnamilegacy; the bitnami/minio repo
      # now has no pullable tags and minio/minio left Docker Hub entirely.
      minio:
        image: bitnamilegacy/minio:2025.4.22-debian-12-r2
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: aistudy
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      NODE_ENV: test
      OPENING_TEST_DB: "1"
      OPENING_TEST_DATABASE_URL: postgres://aistudy:aistudy@127.0.0.1:5432/aistudy_opening_test
      DATABASE_URL: postgres://aistudy:aistudy@127.0.0.1:5432/aistudy_opening_test
      E2E_DATABASE_URL: postgres://aistudy:aistudy@127.0.0.1:5433/aistudy_e2e
      E2E_BASE_URL: http://127.0.0.1:3000
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: aistudy
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-test-auth-secret-at-least-32-chars
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: "3600"
      AUTH_COOKIE_NAME: aistudy_session
      PARSER_PYTHON: ${{ github.workspace }}/.local/docling-venv/bin/python
      PARSER_CWD: ${{ github.workspace }}/services/parser
      HF_HOME: ${{ github.workspace }}/.local/hf-home
      HF_HUB_OFFLINE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/parser/requirements-lock.txt

      - name: Install parser dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .local/docling-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PARSER_PYTHON -m pip install -r services/parser/requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PARSER_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare parser model cache
        shell: pwsh
        working-directory: services/parser
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PARSER_PYTHON -m opening_parser.prepare_models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PARSER_PYTHON -m opening_parser --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python parser tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PARSER_PYTHON -m pytest services/parser/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Plan and tooling checks
        run: |
          node scripts/validate-opening-plan.mjs
          node --test tests/tooling/*.test.mjs

      - name: Unit and contract tests
        run: npm test -- --project unit --project contract

      - name: Technology spike tests
        run: npm test -- --project '@aistudy/spike-*'

      - name: Integration tests
        run: npm run test:integration

      - name: Route handler tests
        run: npm run test:handler

      - name: Browser tests
        run: npm run test:browser

      - name: Build
        run: npm run build
