name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/opening-release
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job pins ubuntu-24.04: since 2026-11 ubuntu-latest resolves to ubuntu-26.04,
# where Playwright 1.53.2 cannot install Chromium and the newer pg_dump client writes
# `SET transaction_timeout`, which the PG16 service rejects on restore. Unpin only
# together with a Playwright upgrade, a PG16-compatible dump client and a green run.
jobs:
  quality:
    name: lint-typecheck-test-build
    needs: [changes, docs, static-unit, integration-parser, handler-browser-spikes, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require actual successful checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/checks.py gate static-unit integration-parser handler-browser-spikes build

  changes:
    name: classify-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    env:
      # Full PR base/head comparison, not just HEAD^ or the last pushed commit.
      DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify complete change set
        id: classify
        run: python3 scripts/ci/checks.py classify

  docs:
    name: documentation-light-check
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify allowlist and whitespace
        run: python3 scripts/ci/checks.py docs

  integration-parser:
    name: integration-parser
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # Integration exercises the real parser, queue and object storage, not E2E.
    services:
      postgres: &test-postgres
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: aistudy
          POSTGRES_PASSWORD: aistudy
          POSTGRES_DB: aistudy_opening_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U aistudy -d aistudy_opening_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis: &test-redis
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # bitnamilegacy/minio: Bitnami moved free versioned tags off docker.io/bitnami; keeps no-CMD GHA service behavior
      # (GitHub Actions service containers cannot set image CMD easily).
      # Bitnami moved pre-2025-08 images to bitnamilegacy; the bitnami/minio repo
      # now has no pullable tags and minio/minio left Docker Hub entirely.
      minio: &test-minio
        image: bitnamilegacy/minio:2025.4.22-debian-12-r2
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: aistudy
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env: &quality-env
      HERMES_HEAVY_ENABLED: "0"
      NODE_ENV: test
      OPENING_TEST_DB: "1"
      # Real collectors reject the default DB port; integration uses this DB.
      OPENING_TEST_DATABASE_URL: postgres://aistudy:aistudy@127.0.0.1:55432/aistudy_opening_test
      DATABASE_URL: postgres://aistudy:aistudy@127.0.0.1:55432/aistudy_opening_test
      # E2E_* are read only by the Playwright browser tests in handler-browser-spikes
      # (separate postgres-e2e service on 5433); other jobs inherit them unused.
      E2E_DATABASE_URL: postgres://aistudy:aistudy@127.0.0.1:5433/aistudy_e2e
      E2E_BASE_URL: http://127.0.0.1:3000
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: aistudy
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-test-auth-secret-at-least-32-chars
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: "3600"
      AUTH_COOKIE_NAME: aistudy_session
      PARSER_PYTHON: ${{ github.workspace }}/.local/docling-venv/bin/python
      PARSER_CWD: ${{ github.workspace }}/services/parser
      HF_HOME: ${{ github.workspace }}/.local/hf-home
      HF_HUB_OFFLINE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - &setup-parser-python
        name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - &cache-parser-venv
        name: Cache parser virtualenv
        id: parser-venv
        uses: actions/cache@v4
        with:
          path: .local/docling-venv
          key: parser-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('services/parser/requirements-lock.txt', 'scripts/ci/install-parser.sh') }}

      - &install-parser
        name: Install and verify parser dependencies
        shell: bash
        env:
          PARSER_CACHE_HIT: ${{ steps.parser-venv.outputs.cache-hit }}
        run: bash scripts/ci/install-parser.sh

      - &cache-parser-models
        name: Cache parser models
        uses: actions/cache@v4
        with:
          path: .local/hf-home
          key: ${{ runner.os }}-parser-models-${{ hashFiles('services/parser/model-manifest.json', 'services/parser/requirements-lock.txt') }}

      - &prepare-parser-models
        name: Prepare parser model cache
        shell: bash
        working-directory: services/parser
        run: |
          set -euo pipefail
          "$PARSER_PYTHON" -m opening_parser.prepare_models
          "$PARSER_PYTHON" -m opening_parser --check

      - name: Python parser tests
        shell: bash
        run: |
          set -euo pipefail
          "$PARSER_PYTHON" -m pytest services/parser/tests -q

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration -- --reporter=default --reporter=json --reporter=github-actions --outputFile.json=test-reports/integration.json

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-integration-parser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  handler-browser-spikes:
    name: handler-browser-spikes
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # Handler/spikes use the guarded test DB; Playwright resets a separate E2E DB.
    # The Chromium spike shares Playwright setup. No worker/parser runs here.
    services:
      postgres: *test-postgres
      postgres-e2e: &e2e-postgres
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: aistudy
          POSTGRES_PASSWORD: aistudy
          POSTGRES_DB: aistudy_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aistudy -d aistudy_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis: *test-redis
      minio: *test-minio

    env: *quality-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Technology spike tests
        run: npm test -- --project '@aistudy/spike-*'

      - name: Route handler tests
        run: npm run test:handler -- --reporter=default --reporter=json --reporter=github-actions --outputFile.json=test-reports/handler.json

      - name: Browser tests
        id: browser_tests
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/default
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-reports/browser.json
        run: npm run test:browser -- --reporter=list,html,json

      - name: Upload browser acceptance evidence
        if: ${{ always() && (steps.browser_tests.outcome == 'success' || steps.browser_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            test-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-handler-browser-spikes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  static-unit:
    name: static-unit-contract-spikes
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Spikes consume real Redis; retain the original isolated service/env setup.
    services:
      postgres: *test-postgres
      postgres-e2e: *e2e-postgres
      redis: *test-redis
      minio: *test-minio
    env: *quality-env
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: CI classifier and gate regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Install dependencies
        run: npm ci
      - name: Check SenseWeave vendor integrity
        run: node scripts/check-senseweave-vendor.mjs
      - name: Lint
        env:
          FIXED_COLOR_BASE: HEAD^1
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Plan and tooling checks
        run: |
          node scripts/validate-opening-plan.mjs
          node --test tests/tooling/*.test.mjs scripts/opening-local-check.test.mjs scripts/check-new-fixed-colors.test.mjs
      # PDF page-image units execute the real Python renderer; models are not needed.
      - *setup-parser-python
      - *cache-parser-venv
      - *install-parser
      - name: Unit, contract and pipeline tests
        run: npm test -- --project unit --project contract --project notion-pipeline

  build:
    name: production-build
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env: *quality-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          AISTUDY_COMMIT: ${{ github.sha }}
        run: npm run build
      # Pack existing build, never bypass lint/typecheck or rebuild on the host.
      # Only mainline push artifacts are trusted by the deployment verifier.
      - name: Pack release runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/opening-release'
        run: |
          mkdir -m 700 release-artifact
          node infra/deploy/verify-release-artifact.mjs pack . release-artifact/release.tar.gz "$GITHUB_SHA"
      - name: Attest release runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/opening-release'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifact/release.tar.gz
      - name: Upload release runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/opening-release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release-artifact/release.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  opening-worker-flow:
    name: isolated-worker-pdf-browser
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # The isolated runner resets only these fresh services. In particular its
    # Redis FLUSHDB must never target the quality job's queue instance.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: opening
          POSTGRES_PASSWORD: opening-local-test
          POSTGRES_DB: aistudy_opening_e2e
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U opening -d aistudy_opening_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: bitnamilegacy/minio:2025.4.22-debian-12-r2
        env:
          MINIO_ROOT_USER: opening-e2e
          MINIO_ROOT_PASSWORD: opening-e2e-local-secret
          MINIO_DEFAULT_BUCKETS: opening-e2e
          MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3100
        ports:
          - 19000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      HERMES_HEAVY_ENABLED: "0"
      NODE_ENV: test
      OPENING_E2E: "1"
      OPENING_RELEASE: "1"
      OPENING_TEACHING_LOOP: "1"
      OPENING_TEACHING_WORKSPACE: "1"
      PARSER_PYTHON: ${{ github.workspace }}/.local/docling-venv/bin/python
      PARSER_CWD: ${{ github.workspace }}/services/parser
      HF_HOME: ${{ github.workspace }}/.local/hf-home
      HF_HUB_OFFLINE: "1"
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/opening-worker-flow
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-reports/opening-worker-flow.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - *setup-parser-python
      - *cache-parser-venv
      - *install-parser
      - *cache-parser-models
      - *prepare-parser-models

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Real worker PDF upload and recovery browser flow
        timeout-minutes: 15
        run: npm run test:browser -- --config playwright.opening.config.mts tests/e2e/opening-workflow.spec.ts --trace on --reporter=list,html,json

      - name: Persisted learning after graceful Web and worker restart
        timeout-minutes: 8
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/opening-restart
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-reports/opening-restart.json
        # Requires the preceding production build and refuses unowned services.
        # The restart fixture preserves the same PG, Redis and S3 between cycles.
        run: node node_modules/@playwright/test/cli.js test --config playwright.opening-restart.config.mts --trace on --reporter=list,html,json

      - name: Upload real worker browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opening-worker-flow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/opening-isolated/
            playwright-report/opening-worker-flow/
            test-reports/opening-worker-flow.json
            test-results/opening-restart/
            playwright-report/opening-restart/
            test-reports/opening-restart.json
          if-no-files-found: warn
          retention-days: 7

  worker-gate:
    name: real-worker-pdf-browser-flow
    needs: [changes, docs, opening-worker-flow]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require actual successful checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/checks.py gate opening-worker-flow
