name: Learning loop source snapshot
on:
  push:
    branches: [feat/learning-loop-hardening-20261014]
    paths: [.github/workflows/learning-loop-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive tracked source and dependency toolchain
        shell: bash
        run: |
          git archive --format=tar.gz --output=source.tar.gz HEAD
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf dependencies.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: learning-loop-source
          path: source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: learning-loop-toolchain
          path: dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
